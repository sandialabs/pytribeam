# Bruker EDS resolution/element-count matrix hardware runner configuration.
# This file is intentionally explicit because the runner is for real ESPRIT
# simulator/hardware validation and may move the detector if move_detector=true.

session:
  dll_dir: "C:/Program Files/Bruker/Esprit API"
  mode: local
  server: "Lokaler Server"
  user: "edx"
  password: "edx"
  host: null
  port: null
  close_on_exit: false
  keep_connection_open: true

output:
  root_dir: "C:/Users/Public/BrukerEDSResolutionMatrix"
  run_name: "eds_resolution_matrix"

detector:
  detector_index: 1
  move_detector: false  # Set true only for real-hardware tests after safety review.
  move_timeout_s: 60.0
  poll_interval_s: 1.0

map:
  pixel_time_us: 1024
  spu_device: 1
  poll_interval_s: 10.0
  max_wait_s: 1200.0
  save_image: true
  image_format: "bmp"


matrix:
  resolutions:
    - [762, 507]   # 386,334
    - [764, 508]   # 388,112
    - [766, 509]   # 389,894
    - [768, 510]   # 391,680
    - [768, 511]   # 392,448
    - [768, 512]   # 393,216
  element_counts: [1,7]

