# Template standalone Bruker EDS workflow YAML for run_bruker_eds_safe_workflow.py.
#
# This config acquires a single-element carbon (C, atomic number 6) profile map.
# The safe workflow CLI forcibly disables Bruker API readback and treats the
# .bcf file as the canonical output.
#
# Path rules:
# - session.dll_dir must exist on the machine running Python, even in TCP mode.
# - Bruker.API.Esprit64.dll must exist in session.dll_dir.
# - output.root_dir is interpreted by the ESPRIT/Bruker machine.

session:
  dll_dir: "C:/Program Files/Bruker/Esprit API"
  mode: local
  server: "Lokaler Server"
  user: "edx"
  password: "edx"
  host: null
  port: null
  close_on_exit: false
  keep_connection_open: true

output:
  root_dir: "C:/Users/apolon/Downloads/EDS"
  run_name: "carbon_eds_map"

detector:
  # Simulator-safe default: do not call Bruker detector position APIs.
  # For real hardware after local safety review, set move_detector: true.
  # With move_detector: true, the workflow defaults to verifying park before
  # acquisition, moving to acquire, and parking after acquisition.
  detector_index: 1
  move_detector: false

  # Hardware-equivalent explicit settings. Uncomment/override for real hardware
  # if you want the safety checks to be obvious in the YAML.
  # verify_park_before: true
  # move_to_acquire_before: true
  # park_after: true

  move_timeout_s: 60.0
  poll_interval_s: 0.5

map:
  mode: profile
  name: "carbon_map"
  width_px: 64
  height_px: 48
  pixel_time_us: 1024
  real_time_s: 0
  spu_device: 1

  save_bcf: true
  save_image: true
  image_format: "bmp"

  # Optional ROI. Comment out for full-frame. ROI must fit within width_px x height_px.
  roi:
    x_start_px: 5
    y_start_px: 5
    width_px: 20
    height_px: 30

  profile:
    elements:
      - atomic_number: 6
        symbol: "C"
        line: "KA"
        energy_keV: 0.0
        width: 1.0

    image_filter: 0
    map_filter: 0
    map_filter_width: 3
    color_mix_method: 0
    brightness: 0.0
    gamma: 1.0
    color_saturation: 1.0
    absolute_scaling: false
    normalization: true
    deconvolution: false

# The safe workflow CLI disables readback regardless of this section. It is set
# false here to document the intended BCF-only use of this template.
readback:
  save_element_npy: false
  save_element_images: false
  log_element_stats: false
